name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支连续推送时取消上一次：MR 上连续 amend 不会堆积一串排队构建，
# 也就不会为一堆中间状态各发一封失败通知。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 在 Windows 上开发的仓库经常丢失 gradlew 的可执行位。
      # 索引里的模式已经修成 100755，这一行是第二道防线 ——
      # 有人重新克隆或复制文件时权限又丢了，也能照常构建。
      - name: Make gradlew executable
        run: chmod +x gradlew

      # --no-daemon：CI 是一次性环境，留着 daemon 只会拖住 runner 退出。
      - name: Build with Gradle
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload jars
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openradio-jars
          path: build/libs/*.jar
          if-no-files-found: ignore
